<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAWADA. Budget Tracker</title>
<meta name="description" content="Personal budget, accounts and debt tracker. Your data stays in your browser.">
<meta name="theme-color" content="#0E1520">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/sawada-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=10">
<script>
  // set the theme before the page draws, so it never flashes the wrong colors
  (function () {
    var t = '';
    try { t = localStorage.getItem('budget-debt-tracker:v1:theme') || ''; } catch (e) {}
    if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
</head>
<body>
<div id="splash" aria-hidden="true">
  <div class="sp-in">
    <img src="assets/sawada-logo.png" width="96" height="96" alt="">
    <div class="sp-name"><b>SAWADA<i>.</i></b> Budget Tracker</div>
    <div class="sp-bar"><span></span></div>
  </div>
</div>
<header class="top">
  <div class="top-inner wrap">
    <div class="brand">
      <img src="assets/sawada-logo.png" alt="SAWADA" width="40" height="40">
      <span class="brand-name"><b>SAWADA<i>.</i></b> Budget Tracker</span>
      <span id="pageTitle" class="page-title"></span>
    </div>
    <nav id="tabs" class="tabs" aria-label="Sections"></nav>
    <div class="top-actions">
      <div id="authSlot" class="auth-slot"></div>
      <button type="button" class="icon-btn" data-act="toggleTheme" id="themeBtn" aria-label="Switch to dark mode">
        <svg class="i-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="i-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button type="button" class="icon-btn burger" data-act="openMenu" aria-label="Open menu" aria-controls="drawer" aria-expanded="false">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
  </div>
</header>

<div id="drawer" class="drawer" hidden>
  <div class="scrim" data-act="closeMenu"></div>
  <aside class="panel" aria-label="Menu">
    <div class="panel-head">
      <div class="brand"><img src="assets/sawada-logo.png" alt="" width="32" height="32"><span><b>SAWADA<i>.</i></b> Budget Tracker</span></div>
      <button type="button" class="icon-btn flat" data-act="closeMenu" aria-label="Close menu">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <nav id="drawerNav" class="drawer-nav" aria-label="Sections"></nav>
    <div id="drawerAuth" class="drawer-auth"></div>
    <div class="appearance">
      <div class="small muted">Appearance</div>
      <div class="seg">
        <button type="button" data-act="setTheme" data-v="light">Light</button>
        <button type="button" data-act="setTheme" data-v="dark">Dark</button>
      </div>
    </div>
  </aside>
</div>

<main id="view" class="wrap"></main>

<dialog id="dlg"><form id="dlgForm" method="dialog" novalidate></form></dialog>
<input type="file" id="fileXlsx" accept=".xlsx,.xlsm" hidden>
<input type="file" id="fileJson" accept=".json,application/json" hidden>
<div id="toast" role="status" aria-live="polite"></div>

<script src="vendor/jszip.min.js" defer></script>
<script src="app.js?v=10" defer></script>
<script type="module" src="cloud.js?v=10"></script>
</body>
</html>
