<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Budget & Debt Tracker</title>
<meta name="description" content="Personal budget, accounts and debt tracker. Your data stays in your browser.">
<meta name="theme-color" content="#1f4e78">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f4e78'/%3E%3Ctext x='32' y='45' font-size='38' text-anchor='middle' fill='white' font-family='Arial'%3E%E2%82%B1%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="top-inner wrap">
    <div class="brand">
      <span class="logo" aria-hidden="true">₱</span>
      <div>
        <h1>Budget &amp; Debt Tracker</h1>
        <p id="saveNote" class="tiny muted"></p>
      </div>
    </div>
  </div>
  <nav id="tabs" class="tabs wrap" aria-label="Sections"></nav>
</header>

<main id="view" class="wrap"></main>

<dialog id="dlg"><form id="dlgForm" method="dialog" novalidate></form></dialog>
<input type="file" id="fileXlsx" accept=".xlsx,.xlsm" hidden>
<input type="file" id="fileJson" accept=".json,application/json" hidden>
<div id="toast" role="status" aria-live="polite"></div>

<script src="vendor/jszip.min.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
